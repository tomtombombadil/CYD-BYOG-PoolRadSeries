; The emulator builds (Claude's side, Linux; never flashed, not in CI):
; the 2.8" ILI9341 resistive firmware with -D CYD_QEMU, run in Espressif's
; QEMU by tools/qemu/run_qemu.py - the card mounted 1-bit SD/MMC (QEMU has
; no SD-over-SPI), taps played from /GOLDBOX/_QEMU/TAPS.TXT, the heap
; printed as it goes. Build from the repo root:
;   pio run -c tools/qemu/qemu.ini -e qemu28
[platformio]
extra_configs = platformio.ini
build_dir = .pio/qemu

[env:qemu28]
extends = env:cyd28_ili9341_res
build_flags =
    ${env:cyd28_ili9341_res.build_flags}
    -D CYD_QEMU
    -I src
lib_extra_dirs = tools/qemu/lib
lib_deps =
    ${env.lib_deps}
    qemu_hal

; The ESP32-S3 board's firmware in QEMU's ESP32-S3 (v0.103.1: Tom's S3
; rebooted at Play): the card is a read-only FAT partition in the flash
; (QEMU's S3 has no SD/MMC; tools/qemu/qemu_s3.csv), the serial on UART0,
; 8 MB PSRAM. run_qemu.py --s3. Saves and the card's caches can't be
; written there.
[env:qemus3]
extends = env:cyd40s3_st7796_cap
board_build.partitions = tools/qemu/qemu_s3.csv
; (DIO flash: QEMU's S3 reads QIO flash 2 bytes late outside the cache)
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_40_ST7796_CAP_S3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CYD_QEMU
    -D CYD_QEMU_FLASHCARD
    -I src
lib_extra_dirs = tools/qemu/lib
lib_deps =
    ${env.lib_deps}
    qemu_hal

; The 5.0" ESP32-S3 board's firmware the same way (run_qemu.py --s3 --env
; qemus3_50): no RGB panel in QEMU - its frame buffer is a PSRAM block and
; every 2x copy into it is checked ("[qemu] 2x screen: ... bad pixels")
[env:qemus3_50]
extends = env:cyd50s3_cap
board_build.partitions = tools/qemu/qemu_s3.csv
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_50_CAP_S3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CYD_QEMU
    -D CYD_QEMU_FLASHCARD
    -I src
lib_extra_dirs = tools/qemu/lib
lib_deps =
    ${env.lib_deps}
    qemu_hal
