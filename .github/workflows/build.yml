name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # "Run workflow" button on the Actions tab. Fill in a tag (e.g. v0.2.0)
  # to publish a release from the current main; leave empty for a plain build.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create = v + the VERSION file, e.g. v0.9.0 (hyphen suffix = pre-release). Leave empty to just build.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Board list comes from platformio.ini: every env with custom_firmware_name.
  boards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import configparser, json
          c = configparser.ConfigParser(interpolation=None, strict=False)
          c.read("platformio.ini", encoding="utf-8")
          inc = [{"env": s[4:], "name": c[s]["custom_firmware_name"]}
                 for s in c.sections()
                 if s.startswith("env:") and c[s].get("custom_firmware_name")]
          print("matrix=" + json.dumps({"include": inc}))
          EOF
      - id: ver
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        # The version is the VERSION file (semantic: fix = Z, feature = Y,
        # major = X). A release tag must be that version (optionally with a
        # pre-release suffix such as v1.2.0-beta.1).
        run: |
          V="v$(tr -d ' \r\n' < VERSION)"
          if [[ ! "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must look like 1.2.3"; exit 1
          fi
          TAG="$RELEASE_TAG"
          if [[ -z "$TAG" && "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; fi
          if [[ -n "$TAG" ]]; then
            if [[ ! "$TAG" =~ ^${V//./\\.}(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::the release tag must be $V (or $V-beta.1 etc.) - bump VERSION first"; exit 1
            fi
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${V}" >> "$GITHUB_OUTPUT"
          fi

  # Engine file-format code, compiled and run on the CI machine
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DAX archives, pictures, game folders
        run: |
          g++ -std=c++17 -O1 -Wall -Werror -fsanitize=address,undefined -Isrc -o test_dax tools/host_tests/test_dax.cpp src/engine/*.cpp
          ./test_dax

  build:
    needs: [boards, tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.boards.outputs.matrix) }}
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build
        env:
          # A release's own tag (e.g. v1.2.0-beta.1); tools/version.py checks
          # it against VERSION and otherwise uses VERSION
          CYD_VERSION: ${{ needs.boards.outputs.version }}
        run: pio run -e ${{ matrix.env }}

      - name: Name firmware
        run: |
          mkdir -p out
          cp .pio/build/${{ matrix.env }}/firmware.factory.bin "out/${{ matrix.name }}.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.env }}
          path: out/*.bin

      # Symbols for decoding a crash backtrace from the device log
      # (xtensa-esp32-elf-addr2line -pfiaC -e <file>.elf <addresses>)
      - name: Keep symbols
        run: |
          mkdir -p sym
          cp .pio/build/${{ matrix.env }}/firmware.elf "sym/${{ matrix.name }}.elf"
      - uses: actions/upload-artifact@v4
        with:
          name: elf-${{ matrix.env }}
          path: sym/*.elf
          retention-days: 90

  # Tag pushes, or "Run workflow" with a release_tag, become a GitHub
  # release. Tags with a hyphen (v0.1.0-alpha.1) are marked pre-release.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [boards, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: fw-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: sym
          pattern: elf-*
          merge-multiple: true
      - name: Zip symbols
        run: cd sym && zip -9 ../out/debug-symbols.zip *.elf
      - uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this commit when started from "Run workflow"
          tag_name: ${{ needs.boards.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            out/*.bin
            out/debug-symbols.zip
          prerelease: ${{ contains(needs.boards.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            **Easiest install:** https://tomtombombadil.github.io/CYD-BYOG-PoolRadSeries/ (Chrome or Edge).

            Bring your own game: copy the original DOS game files from your own copy to /GOLDBOX/<game>/ on a FAT32 microSD card.

            Or download the `.bin` for your board and flash it at address **0x0**.
            Files are named by screen size, display driver and touch type.
            `debug-symbols.zip` is only for decoding crash reports from the device log.

  # Web flasher on GitHub Pages: every push to main and every release.
  # Tom tests new builds by flashing them from here (his choice).
  pages:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [boards, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bins
          pattern: fw-*
          merge-multiple: true
      - name: Assemble site
        run: python3 tools/make_site.py --bins bins --version "${{ needs.boards.outputs.version }}" --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
